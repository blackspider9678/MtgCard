plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'maven-publish'
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

def commonMainJava = fileTree('../common/src/main/java') {
    include 'com/spider/mtgcard/**'
    exclude 'com/spider/mtgcard/command/DeckServer_Command.java'
    exclude 'com/spider/mtgcard/command/MtgRootCommand.java'
    exclude 'com/spider/mtgcard/content/pack/PackMobDropEvents.java'
    exclude 'com/spider/mtgcard/content/pack/PackServerEvents.java'
    exclude 'com/spider/mtgcard/deckbox/net/**'
    exclude 'com/spider/mtgcard/deckcontrol/DeckControlPackets.java'
    exclude 'com/spider/mtgcard/loot/**'
    exclude 'com/spider/mtgcard/ModEvents.java'
    exclude 'com/spider/mtgcard/net/CustomCardPackets.java'
    exclude 'com/spider/mtgcard/net/CustomCardSync.java'
    exclude 'com/spider/mtgcard/net/CustomImportPackets.java'
}

def commonClientJava = fileTree('../common/src/client/java') {
    include 'com/spider/mtgcard/client/CardClientHooks.java'
    include 'com/spider/mtgcard/client/CardLargeViewScreen.java'
    include 'com/spider/mtgcard/client/ScryfallInfoManager.java'
    include 'com/spider/mtgcard/client/command/DeckClientIO.java'
    include 'com/spider/mtgcard/client/compat/**'
    exclude 'com/spider/mtgcard/client/compat/jei/**'
    include 'com/spider/mtgcard/client/content/pack/custom/ClientCardIndex.java'
    include 'com/spider/mtgcard/client/deckcontrol/DeckControlEntityRenderer.java'
    include 'com/spider/mtgcard/client/display/CardDisplayEntityRenderer.java'
    include 'com/spider/mtgcard/client/displayblock/**'
    include 'com/spider/mtgcard/client/gui/CardDatabaseScreen.java'
    include 'com/spider/mtgcard/client/gui/CardSlotArtRenderer.java'
    include 'com/spider/mtgcard/client/gui/CardStoreScreen.java'
    include 'com/spider/mtgcard/client/gui/CustomImportScreen.java'
    include 'com/spider/mtgcard/client/gui/DeckControlScreen.java'
    include 'com/spider/mtgcard/client/gui/DeckboxScreen.java'
    include 'com/spider/mtgcard/client/gui/DiceCustomizerScreen.java'
    include 'com/spider/mtgcard/client/gui/FileDropReceiver.java'
    include 'com/spider/mtgcard/client/gui/GraveyardScreen.java'
    include 'com/spider/mtgcard/client/gui/MtgGuiChrome.java'
    include 'com/spider/mtgcard/client/guidebook/**'
    include 'com/spider/mtgcard/client/hud/CardPeekHud.java'
    include 'com/spider/mtgcard/client/input/GuiCardFaceFlipHandler.java'
    include 'com/spider/mtgcard/client/input/GuiCardFaceFlipper.java'
    include 'com/spider/mtgcard/client/input/ModKeybinds.java'
    include 'com/spider/mtgcard/client/java/CardArtManager.java'
    include 'com/spider/mtgcard/client/life/ColorWheelWidget.java'
    include 'com/spider/mtgcard/client/life/LifePointClientState.java'
    include 'com/spider/mtgcard/client/life/LifePointFrontTextRenderer.java'
    include 'com/spider/mtgcard/client/life/LifePointPresetStore.java'
    include 'com/spider/mtgcard/client/life/LifePointScreen.java'
    include 'com/spider/mtgcard/client/render/CardDatabaseBlockEntityRenderer.java'
    include 'com/spider/mtgcard/client/render/CardFoilUtil.java'
    include 'com/spider/mtgcard/client/render/DiceItemRenderer.java'
    include 'com/spider/mtgcard/client/render/DiceTextureCache.java'
    include 'com/spider/mtgcard/client/render/tex/CardDbBinderOverlayTex.java'
    include 'com/spider/mtgcard/client/ui/**'
    exclude 'com/spider/mtgcard/client/net/DBClientPackets.java'
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources', '../common/src/main/resources']
    }
}

tasks.named('compileJava') {
    source(commonMainJava)
    source(commonClientJava)
}

tasks.named('sourcesJar') {
    from(commonMainJava)
    from(commonClientJava)
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', rootProject.mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = file('runs/client')
        }
        server {
            server()
            gameDirectory = file('runs/server')
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("org.sejda.imageio:webp-imageio:0.1.6")
    implementation("com.electronwill.night-config:core:3.6.7")
    implementation("com.electronwill.night-config:toml:3.6.7")
    compileOnly "maven.modrinth:aC3cM3Vq:i1duwnJl" // Mouse Tweaks API annotation
}

processResources {
    inputs.property 'version', rootProject.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'minecraft_version_range', rootProject.minecraft_version_range
    inputs.property 'neoforge_version', rootProject.neoforge_version
    inputs.property 'neoforge_loader_version_range', rootProject.neoforge_loader_version_range
    filteringCharset 'UTF-8'

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': rootProject.version,
                'minecraft_version': rootProject.minecraft_version,
                'minecraft_version_range': rootProject.minecraft_version_range,
                'neoforge_version': rootProject.neoforge_version,
                'neoforge_loader_version_range': rootProject.neoforge_loader_version_range
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
